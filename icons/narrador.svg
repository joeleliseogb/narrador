<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pageLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Squircle Plate -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.4" />

  <!-- Sound Waves Behind Headband -->
  <g stroke="#93c5fd" stroke-width="6" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M 175 195 A 115 115 0 0 0 141 240" />
    <path d="M 337 195 A 115 115 0 0 1 371 240" />
  </g>

  <!-- Headphone Arch -->
  <path d="M 148 260 C 148 125, 364 125, 364 260" fill="none" stroke="url(#headphoneGrad)" stroke-width="26" stroke-linecap="round" />
  <path d="M 182 225 C 195 155, 317 155, 330 225" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" opacity="0.85" />

  <!-- Open Book -->
  <g>
    <!-- Left Page -->
    <path d="M 256 380 C 215 360, 140 360, 115 382 L 115 282 C 140 260, 215 260, 256 280 Z" fill="url(#pageLeft)" stroke="#1e3a8a" stroke-width="2" stroke-opacity="0.4" />
    <!-- Right Page -->
    <path d="M 256 380 C 297 360, 372 360, 397 382 L 397 282 C 372 260, 297 260, 256 280 Z" fill="url(#pageRight)" stroke="#1e3a8a" stroke-width="2" stroke-opacity="0.4" />
    <!-- Spine Line -->
    <path d="M 256 280 L 256 382" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Left Page Text Lines -->
    <g stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M 144 298 C 170 289, 215 289, 240 300" />
      <path d="M 144 318 C 170 309, 215 309, 240 320" />
      <path d="M 144 338 C 170 329, 215 329, 240 340" />
      <path d="M 154 358 C 180 349, 215 349, 240 360" />
    </g>

    <!-- Right Page Text Lines -->
    <g stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M 272 300 C 297 291, 342 291, 368 298" />
      <path d="M 272 320 C 297 311, 342 311, 368 318" />
      <path d="M 272 340 C 297 331, 342 331, 368 338" />
      <path d="M 272 360 C 297 351, 332 351, 358 358" />
    </g>

    <!-- Bookmark Ribbon -->
    <path d="M 252 281 L 252 412 L 256 404 L 260 412 L 260 281 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Ear Cups -->
  <g>
    <rect x="124" y="238" width="44" height="76" rx="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5" />
    <rect x="130" y="244" width="32" height="64" rx="16" fill="#f1f5f9" />
    <rect x="344" y="238" width="44" height="76" rx="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5" />
    <rect x="350" y="244" width="32" height="64" rx="16" fill="#f1f5f9" />
  </g>

  <!-- Speech Dots / Audio Pulse -->
  <g fill="#f59e0b">
    <circle cx="256" cy="222" r="6" />
    <circle cx="234" cy="222" r="4.5" opacity="0.8" />
    <circle cx="278" cy="222" r="4.5" opacity="0.8" />
    <circle cx="216" cy="222" r="3" opacity="0.5" />
    <circle cx="296" cy="222" r="3" opacity="0.5" />
  </g>
</svg>